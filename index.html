<meta name="apple-mobile-web-app-title" content="買菜記帳">
<style>
:root{--primary:#4f9d6e;--dark:#3d7d56;--bg:#f3f9f4;--text:#2c2c2c;--light:#6b6b6b;--danger:#d9534f;--border:#d7e8db;--chip:#e6f4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);font-size:20px;padding-bottom:40px}
header{background:var(--primary);color:#fff;padding:18px 16px;text-align:center;font-size:26px;font-weight:bold;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tabs{display:flex;background:#fff;position:sticky;top:64px;z-index:9;box-shadow:0 2px 4px rgba(0,0,0,.06)}
.tab{flex:1;padding:16px 0;text-align:center;font-size:20px;font-weight:bold;color:var(--light);background:#fff;border:none;border-bottom:4px solid transparent}
.tab.active{color:var(--dark);border-bottom-color:var(--primary)}
.page{display:none;padding:16px;max-width:600px;margin:0 auto}.page.active{display:block}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{margin:0 0 12px;font-size:21px;color:var(--dark)}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--chip);border-radius:12px;padding:10px 4px;text-align:center}
.sum small{display:block;font-size:15px;color:var(--light)}
.sum b{font-size:22px;color:var(--dark)}
.sum.big{grid-column:1/-1;background:var(--primary);color:#fff;padding:14px}
.sum.big small{color:#e6f4ea}.sum.big b{font-size:40px;color:#fff}
input,textarea{width:100%;padding:14px;font-size:20px;border:2px solid var(--border);border-radius:10px;background:#fffdf9;color:var(--text);font-family:inherit}
input[type=date]{font-weight:bold;min-height:56px;-webkit-appearance:none;appearance:none}
.amount{font-size:38px;font-weight:bold;text-align:center;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{flex:1 1 auto;min-width:90px;background:var(--chip);border:2px solid var(--border);border-radius:12px;padding:14px 10px;font-size:20px;font-weight:bold;color:var(--text);text-align:center}
.chip.sel{background:var(--primary);color:#fff;border-color:var(--dark)}
.btn{display:block;width:100%;padding:16px;font-size:22px;font-weight:bold;border:none;border-radius:12px;color:#fff;background:var(--primary);margin-top:10px}
.btn:active{background:var(--dark)}.btn.gray{background:#8a8a8a}.btn.red{background:var(--danger)}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .l{flex:1}.row .l small{display:block;color:var(--light);font-size:16px}
.row .amt{font-weight:bold;font-size:22px}
.day{background:var(--chip);border-radius:10px;padding:8px 12px;margin:14px 0 4px;display:flex;justify-content:space-between;font-weight:bold;color:var(--dark)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{background:var(--chip);border:none;border-radius:10px;font-size:22px;padding:10px 18px;color:var(--dark);font-weight:bold}
.empty{text-align:center;color:var(--light);padding:20px}
.del{background:none;border:none;color:var(--danger);font-size:24px;padding:6px 10px}
.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 22px;border-radius:24px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
#palette{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.25);border:none;border-radius:50%;width:44px;height:44px;font-size:24px;line-height:1;padding:0}
#palette:active{background:rgba(255,255,255,.45)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{border:3px solid var(--border);background:#fff;border-radius:14px;padding:10px 4px;font-size:16px;font-weight:bold;color:var(--text)}
.theme i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 6px}
.theme.sel{border-color:var(--primary);background:var(--chip)}
</style>
</head>
<body>
<header>買菜記帳<button id="palette" aria-label="主題顏色">🎨</button></header>
<div class="tabs">
  <button class="tab active" data-p="add">記一筆</button>
  <button class="tab" data-p="list">明細</button>
  <button class="tab" data-p="set">品項</button>
</div>

<div class="page active" id="add">
  <div class="card">
    <h2>🏷️ 點選品項來記帳</h2>
    <div class="chips" id="chips"></div>
    <h2 style="margin-top:16px">📅 日期（預設今天，可更改）</h2>
    <input type="date" id="date">
  </div>
  <div class="card"><h2>當日明細</h2><div id="todayList"></div></div>
  <div class="card">
    <div class="sums">
      <div class="sum big"><small id="dayLabel">當日累計</small><b id="sDay">$0</b></div>
      <div class="sum"><small>本週</small><b id="sWeek">$0</b></div>
      <div class="sum"><small>本月</small><b id="sMonth">$0</b></div>
      <div class="sum"><small>當日筆數</small><b id="sCnt">0</b></div>
    </div>
  </div>
</div>

<div class="page" id="list">
  <div class="card">
    <div class="nav"><button id="prev">‹</button><b id="mLabel"></b><button id="next">›</button></div>
    <div class="sums">
      <div class="sum big"><small>本月累計</small><b id="mTotal">$0</b></div>
    </div>
  </div>
  <div class="card" id="monthList"></div>
</div>

<div class="page" id="set">
  <div class="card">
    <h2>常用品項</h2>
    <div id="catList"></div>
    <input type="text" id="newCat" placeholder="新增品項，例如：早餐" style="margin-top:12px">
    <button class="btn" id="addCat">新增品項</button>
  </div>
</div>

<div class="mask" id="tmask"><div class="modal">
  <h2 style="margin-top:0;color:var(--dark)">🎨 選擇主題顏色</h2>
  <div class="themes" id="themes"></div>
  <button class="btn gray" id="tClose">關閉</button>
</div></div>
<div class="mask" id="amask"><div class="modal">
  <h2 id="aTitle" style="margin-top:0;color:var(--dark);font-size:26px"></h2>
  <div id="aDate" style="color:var(--light);font-size:17px"></div>
  <input type="number" inputmode="numeric" class="amount" id="amount" placeholder="多少錢？">
  <input type="text" id="note" placeholder="備註（選填）">
  <button class="btn" id="save">➕ 記一筆</button>
  <button class="btn gray" id="aCancel">取消</button>
</div></div>
<div class="mask" id="mask"><div class="modal">
  <h2 style="margin-top:0;color:var(--dark)">修改這筆</h2>
  <input type="date" id="eDate">
  <input type="number" inputmode="numeric" id="eAmt" placeholder="金額" style="margin-top:10px">
  <div class="chips" id="eChips"></div>
  <input type="text" id="eNote" placeholder="備註">
  <button class="btn" id="eSave">儲存</button>
  <button class="btn red" id="eDel">刪除這筆</button>
  <button class="btn gray" id="eCancel">取消</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const KEY='marketExpenses.v1',CKEY='marketCats.v1';
let items=JSON.parse(localStorage.getItem(KEY)||'[]');
let cats=JSON.parse(localStorage.getItem(CKEY)||'null')||['蔬菜','肉類','魚／海鮮','水果','豆腐／蛋','調味料','其他'];
let selCat=null,editId=null,eCat=null;
let view=new Date();view.setDate(1);

const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money=n=>'$'+n.toLocaleString();
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const wd=s=>'日一二三四五六'[parse(s).getDay()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(CKEY,JSON.stringify(cats))};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
const sum=a=>a.reduce((s,x)=>s+x.amount,0);

function weekRange(s){const d=parse(s);const off=(d.getDay()+6)%7;const a=new Date(d);a.setDate(d.getDate()-off);const b=new Date(a);b.setDate(a.getDate()+6);return[fmt(a),fmt(b)]}

function rowHtml(x){return `<div class="row" data-id="${x.id}"><div class="l">${esc(x.cat)}<small>${esc(x.note||'')}</small></div><div class="amt">${money(x.amount)}</div></div>`}

function render(){
  const d=$('date').value||fmt(new Date());
  const day=items.filter(x=>x.date===d);
  const [w1,w2]=weekRange(d);
  const ym=d.slice(0,7);
  $('dayLabel').textContent=(d===fmt(new Date())?'今日':d.slice(5).replace('-','/')+'（'+wd(d)+'）')+'累計';
  $('sDay').textContent=money(sum(day));
  $('sWeek').textContent=money(sum(items.filter(x=>x.date>=w1&&x.date<=w2)));
  $('sMonth').textContent=money(sum(items.filter(x=>x.date.startsWith(ym))));
  $('sCnt').textContent=day.length;
  $('todayList').innerHTML=day.length?day.slice().reverse().map(rowHtml).join(''):'<div class="empty">這天還沒有記錄</div>';
  $('chips').innerHTML=cats.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  // month list
  const vm=`${view.getFullYear()}-${pad(view.getMonth()+1)}`;
  $('mLabel').textContent=`${view.getFullYear()} 年 ${view.getMonth()+1} 月`;
  const mi=items.filter(x=>x.date.startsWith(vm));
  $('mTotal').textContent=money(sum(mi));
  const dates=[...new Set(mi.map(x=>x.date))].sort().reverse();
  $('monthList').innerHTML=dates.length?dates.map(dt=>{const a=mi.filter(x=>x.date===dt);return `<div class="day"><span>${dt.slice(5).replace('-','/')}（${wd(dt)}）</span><span>${money(sum(a))}</span></div>`+a.slice().reverse().map(rowHtml).join('')}).join(''):'<div class="empty">這個月還沒有記錄</div>';
  // cats
  $('catList').innerHTML=cats.map((c,i)=>`<div class="row"><div class="l">${esc(c)}</div><button class="del" data-i="${i}">🗑</button></div>`).join('');
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab,.page').forEach(e=>e.classList.remove('active'));
  b.classList.add('active');$(b.dataset.p).classList.add('active');window.scrollTo(0,0);
});
$('date').value=fmt(new Date());
$('date').onchange=()=>{if(!$('date').value)$('date').value=fmt(new Date());render()};
$('chips').onclick=e=>{
  const c=e.target.closest('.chip');if(!c)return;
  selCat=c.dataset.c;
  $('aTitle').textContent=selCat;
  const d=$('date').value;$('aDate').textContent='📅 '+d.replace(/-/g,'/')+'（'+wd(d)+'）';
  $('amount').value='';$('note').value='';
  $('amask').classList.add('show');$('amount').focus();
};
$('aCancel').onclick=()=>$('amask').classList.remove('show');
$('save').onclick=()=>{
  const amt=Math.round(Number($('amount').value));
  if(!amt||amt<=0){toast('請先輸入金額');$('amount').focus();return}
  items.push({id:Date.now()+''+Math.random().toString(36).slice(2,5),date:$('date').value,amount:amt,cat:selCat,note:$('note').value.trim()});
  save();$('amask').classList.remove('show');render();toast('✅ 已記錄 '+selCat+' '+money(amt));
};
$('amount').addEventListener('keydown',e=>{if(e.key==='Enter')$('save').click()});
document.addEventListener('click',e=>{const r=e.target.closest('.row[data-id]');if(r)openEdit(r.dataset.id)});

function openEdit(id){
  const x=items.find(i=>i.id===id);if(!x)return;
  editId=id;eCat=x.cat;$('eDate').value=x.date;$('eAmt').value=x.amount;$('eNote').value=x.note||'';
  drawE();$('mask').classList.add('show');
}
function drawE(){const all=cats.includes(eCat)?cats:[...cats,eCat];$('eChips').innerHTML=all.map(c=>`<button class="chip ${c===eCat?'sel':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
$('eChips').onclick=e=>{const c=e.target.closest('.chip');if(c){eCat=c.dataset.c;drawE()}};
$('eSave').onclick=()=>{
  const amt=Math.round(Number($('eAmt').value));if(!amt||amt<=0){toast('請輸入金額');return}
  const x=items.find(i=>i.id===editId);
  Object.assign(x,{date:$('eDate').value||x.date,amount:amt,cat:eCat,note:$('eNote').value.trim()});
  save();$('mask').classList.remove('show');render();toast('已儲存');
};
$('eDel').onclick=()=>{if(confirm('確定要刪除這一筆嗎？')){items=items.filter(i=>i.id!==editId);save();$('mask').classList.remove('show');render();toast('已刪除')}};
$('eCancel').onclick=()=>$('mask').classList.remove('show');

$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};

$('addCat').onclick=()=>{const v=$('newCat').value.trim();if(!v)return;if(cats.includes(v)){toast('已經有這個品項');return}cats.push(v);$('newCat').value='';save();render()};
$('catList').onclick=e=>{const b=e.target.closest('.del');if(!b)return;const c=cats[b.dataset.i];if(confirm(`刪除品項「${c}」？（已記錄的明細不受影響）`)){cats.splice(b.dataset.i,1);save();render()}};

const THEMES=[
  {n:'青蔥綠',p:'#4f9d6e',d:'#3d7d56',bg:'#f3f9f4',c:'#e6f4ea',b:'#d7e8db'},
  {n:'番茄紅',p:'#d9534f',d:'#b23f3b',bg:'#fdf3f2',c:'#fbe3e1',b:'#f0cfcc'},
  {n:'南瓜橘',p:'#e8893a',d:'#c46d22',bg:'#fff7ee',c:'#fdebd5',b:'#f3d9b9'},
  {n:'葡萄紫',p:'#8a6bb8',d:'#6c4f99',bg:'#f6f2fa',c:'#ebe3f4',b:'#d9cce8'},
  {n:'海洋藍',p:'#4a8fc2',d:'#34709f',bg:'#f1f7fb',c:'#e0eef8',b:'#c9ddec'},
  {n:'玫瑰粉',p:'#d9738f',d:'#b55471',bg:'#fdf3f6',c:'#fae1e8',b:'#f0ccd7'}
];
let themeIdx=Number(localStorage.getItem('marketTheme.v1')||0);
if(!THEMES[themeIdx])themeIdx=0;
function applyTheme(){
  const t=THEMES[themeIdx],s=document.documentElement.style;
  s.setProperty('--primary',t.p);s.setProperty('--dark',t.d);s.setProperty('--bg',t.bg);s.setProperty('--chip',t.c);s.setProperty('--border',t.b);
  $('themes').innerHTML=THEMES.map((x,i)=>`<button class="theme ${i===themeIdx?'sel':''}" data-i="${i}"><i style="background:${x.p}"></i>${x.n}</button>`).join('');
}
$('themes').onclick=e=>{const b=e.target.closest('.theme');if(!b)return;themeIdx=Number(b.dataset.i);localStorage.setItem('marketTheme.v1',themeIdx);applyTheme();$('tmask').classList.remove('show')};
$('palette').onclick=()=>$('tmask').classList.add('show');
$('tClose').onclick=()=>$('tmask').classList.remove('show');
applyTheme();
render();
</script>
</body>
</html>
